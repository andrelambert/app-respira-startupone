# Mantém a versão pública acordada (M5, §7.6 do briefing).
# O Oracle Always Free para após 7 dias sem uso (e pode ser apagado após 90
# dias parado); o Render gratuito dorme após 15 min sem tráfego. A cada 10 min,
# um GET no /health mantém o Render acordado e faz uma consulta real no Oracle.
# Custo zero: repositório público (minutos grátis) e um serviço 24 h cabe nas
# 750 h/mês do Render gratuito. O GitHub pode atrasar o agendamento alguns
# minutos e o desliga após 60 dias sem commits no repositório.
# Sem segredos: o /health é público e não devolve dado de usuário.
name: Manter ativo

on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 min (o Render dorme após 15)
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # menor que o intervalo: execuções não se sobrepõem
    steps:
      - name: GET /health (com espera para o Render acordar)
        env:
          URL: ${{ vars.RESPIRA_API_URL || 'https://respira-api-qo4n.onrender.com' }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors \
               --max-time 90 "$URL/health"
