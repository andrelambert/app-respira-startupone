# Mantém a versão pública acordada (M5, §7.6 do briefing).
# O Oracle Always Free para após 7 dias sem uso (e pode ser apagado após 90
# dias parado); o Render gratuito dorme após 15 min sem tráfego. Duas vezes por
# semana, um GET no /health acorda o Render e faz uma consulta real no Oracle.
# Sem segredos: o /health é público e não devolve dado de usuário.
name: Manter ativo

on:
  schedule:
    - cron: "17 11 * * 1,4" # segunda e quinta, 08:17 em Brasília
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GET /health (com espera para o Render acordar)
        env:
          URL: ${{ vars.RESPIRA_API_URL || 'https://respira-api-qo4n.onrender.com' }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors \
               --max-time 90 "$URL/health"
